services:

  traefik:
    image: traefik:v3.7.6
    container_name: traefik
    restart: unless-stopped

    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false

      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https

      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/acme.json:/etc/traefik/acme/acme.json

    networks:
      - proxy

  postgres:
    image: postgres:17-alpine
    container_name: postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql



    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - internal

  backend:
    image: ghcr.io/andrekn95/examendev-backend:latest
    pull_policy: always
    container_name: flask-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

    networks:
      - proxy
      - internal

    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`pilapanta.byronrm.com`) && PathPrefix(`/api`)
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.tls.certresolver=letsencrypt
      - traefik.http.services.backend.loadbalancer.server.port=5000

  frontend:
    image: ghcr.io/andrekn95/examendev-frontend:latest
    pull_policy: always
    container_name: angular-frontend
    restart: unless-stopped

    depends_on:
      - backend

    networks:
      - proxy

    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`pilapanta.byronrm.com`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls.certresolver=letsencrypt
      # Se asigna prioridad baja para que resuelva primero las rutas con PathPrefix (/api, /portainer)
      - traefik.http.routers.frontend.priority=10
      - traefik.http.services.frontend.loadbalancer.server.port=80

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

      SCRIPT_NAME: /pgadmin
      PROXY_X_PREFIX_COUNT: 1
  

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    labels:
       - traefik.enable=true
       - traefik.http.routers.pgadmin.rule=Host(`pilapanta.byronrm.com`) && PathPrefix(`/pgadmin`)
       - traefik.http.routers.pgadmin.entrypoints=websecure
       - traefik.http.routers.pgadmin.tls.certresolver=letsencrypt

       - traefik.http.middlewares.pgadmin-stripprefix.stripprefix.prefixes=/pgadmin
       - traefik.http.routers.pgadmin.middlewares=pgadmin-stripprefix

       - traefik.http.services.pgadmin.loadbalancer.server.port=80
    networks:
      - internal
      - proxy
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: unless-stopped

    command: -H unix:///var/run/docker.sock

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

    networks:
      - proxy

    labels:
      - traefik.enable=true

      - traefik.http.routers.portainer.rule=Host(`pilapanta.byronrm.com`) && (PathPrefix(`/portainer`) || PathPrefix(`/portainer/`))
      - traefik.http.routers.portainer.entrypoints=websecure
      - traefik.http.routers.portainer.tls.certresolver=letsencrypt

      - traefik.http.middlewares.portainer-stripprefix.stripprefix.prefixes=/portainer
      - traefik.http.routers.portainer.middlewares=portainer-stripprefix

      - traefik.http.services.portainer.loadbalancer.server.port=9000

volumes:
  postgres_data:
  pgadmin_data:
  portainer_data:

networks:
  proxy:
    driver: bridge
  internal:
    driver: bridge
