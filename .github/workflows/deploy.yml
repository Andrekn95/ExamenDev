name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build Backend
        run: |
          docker build -t ghcr.io/andrekn95/examendev-backend:latest ./backend

      - name: Push Backend
        run: |
          docker push ghcr.io/andrekn95/examendev-backend:latest

      - name: Build Frontend
        run: |
          docker build -t ghcr.io/andrekn95/examendev-frontend:latest ./front

      - name: Push Frontend
        run: |
          docker push ghcr.io/andrekn95/examendev-frontend:latest

      - name: Deploy VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/devops-proyecto1
            git pull
            docker compose pull
            docker compose up -d